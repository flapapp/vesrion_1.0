<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PORU4 - Головна сторінка</title>
    <link rel="icon" type="image/png" href="logo.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
            overflow-x: hidden;
        }

        .container {
            max-width: 414px;
            margin: 0 auto;
            background: #fff;
            min-height: 100vh;
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.3);
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 25px 20px;
            text-align: center;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: float 8s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(180deg); }
        }

        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 15px;
            background: white;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            position: relative;
            z-index: 1;
            animation: logoPulse 3s ease-in-out infinite;
        }

        @keyframes logoPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .logo img {
            width: 60px;
            height: 60px;
            object-fit: contain;
        }

        .app-title {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
            position: relative;
            z-index: 1;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .app-subtitle {
            font-size: 16px;
            opacity: 0.95;
            position: relative;
            z-index: 1;
            font-weight: 500;
        }

        /* Main Menu */
        .main-menu {
            padding: 30px 20px;
            text-align: center;
        }

        .menu-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 30px;
            color: #333;
        }

        .menu-options {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 30px;
        }

        .menu-option {
            background: white;
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            border: 3px solid transparent;
            text-decoration: none;
            color: inherit;
        }

        .menu-option:hover {
            transform: translateY(-5px);
            border-color: #667eea;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
        }

        .option-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .option-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #333;
        }

        .option-description {
            font-size: 14px;
            color: #666;
            line-height: 1.5;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .container {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo">
                <img src="logo.png" alt="PORU4 Logo">
            </div>
            <h1 class="app-title">PORU4</h1>
            <p class="app-subtitle">Кімнати для двох</p>
        </div>

        <!-- Main Menu -->
        <div class="main-menu">
            <h2 class="menu-title">Оберіть дію</h2>
            <div class="menu-options">
                <a href="02-create-room.html" class="menu-option">
                    <div class="option-icon">🏠</div>
                    <div class="option-title">Створити</div>
                    <div class="option-description">Створити нову кімнату</div>
                </a>
                <a href="03-join-room.html" class="menu-option">
                    <div class="option-icon">🔑</div>
                    <div class="option-title">Приєднатися</div>
                    <div class="option-description">Приєднатися за кодом</div>
                </a>
                <a href="04-rooms-list.html" class="menu-option">
                    <div class="option-icon">📋</div>
                    <div class="option-title">Кімнати</div>
                    <div class="option-description">Мої створені та приєднані кімнати</div>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
