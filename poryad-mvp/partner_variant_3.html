<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poryad - Партнер (Варіант 3)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            min-height: 100vh;
            color: #5d4037;
        }

        .header {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 182, 193, 0.3);
            padding: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ff6b6b, #ffa726, #ff5722);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6b6b, #ffa726);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .welcome-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 182, 193, 0.3);
            border-radius: 32px;
            padding: 48px;
            box-shadow: 
                0 20px 40px rgba(252, 182, 159, 0.3),
                0 0 0 1px rgba(255, 255, 255, 0.2);
            text-align: center;
            margin-bottom: 48px;
            position: relative;
            overflow: hidden;
        }

        .welcome-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 8px;
            background: linear-gradient(90deg, #ff6b6b, #ffa726, #ff5722);
        }

        .welcome-image {
            width: 240px;
            height: 240px;
            border-radius: 24px;
            object-fit: cover;
            margin: 0 auto 24px;
            display: block;
            box-shadow: 0 15px 30px rgba(255, 107, 107, 0.3);
            border: 3px solid rgba(255, 182, 193, 0.5);
        }

        .welcome-text {
            font-size: 1.8rem;
            color: #5d4037;
            margin-bottom: 36px;
            font-weight: 700;
            line-height: 1.4;
        }

        .start-btn {
            background: linear-gradient(135deg, #ff6b6b, #ffa726);
            color: white;
            border: none;
            padding: 20px 40px;
            border-radius: 24px;
            font-size: 1.3rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .start-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.6s;
        }

        .start-btn:hover::before {
            left: 100%;
        }

        .start-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(255, 107, 107, 0.4);
        }

        .challenge-info {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 182, 193, 0.3);
            border-radius: 32px;
            padding: 36px;
            box-shadow: 
                0 15px 30px rgba(252, 182, 159, 0.2),
                0 0 0 1px rgba(255, 255, 255, 0.2);
            margin-bottom: 48px;
        }

        .challenge-title {
            font-size: 2.2rem;
            color: #5d4037;
            margin-bottom: 20px;
            font-weight: 800;
            background: linear-gradient(135deg, #ff6b6b, #ffa726);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .challenge-description {
            color: #8d6e63;
            margin-bottom: 24px;
            line-height: 1.6;
            font-size: 1.1rem;
        }

        .condition-btn {
            background: linear-gradient(135deg, #4caf50, #8bc34a);
            color: white;
            border: none;
            padding: 18px 36px;
            border-radius: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .condition-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(76, 175, 80, 0.4);
        }

        .calendar {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 182, 193, 0.3);
            border-radius: 32px;
            padding: 36px;
            box-shadow: 
                0 15px 30px rgba(252, 182, 159, 0.2),
                0 0 0 1px rgba(255, 255, 255, 0.2);
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 36px;
        }

        .calendar-title {
            font-size: 2rem;
            color: #5d4037;
            font-weight: 800;
        }

        .calendar-nav {
            display: flex;
            gap: 12px;
        }

        .nav-btn {
            background: rgba(255, 182, 193, 0.3);
            border: 2px solid rgba(255, 107, 107, 0.3);
            padding: 12px 16px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #5d4037;
            font-weight: 600;
        }

        .nav-btn:hover {
            background: rgba(255, 107, 107, 0.2);
            border-color: rgba(255, 107, 107, 0.6);
            transform: translateY(-2px);
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 12px;
        }

        .calendar-day {
            aspect-ratio: 1;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            background: rgba(255, 255, 255, 0.6);
            border: 2px solid rgba(255, 182, 193, 0.3);
        }

        .calendar-day:hover {
            background: rgba(255, 107, 107, 0.2);
            border-color: rgba(255, 107, 107, 0.6);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(255, 107, 107, 0.2);
        }

        .calendar-day.completed {
            background: linear-gradient(135deg, #4caf50, #8bc34a);
            border-color: rgba(76, 175, 80, 0.5);
            color: white;
        }

        .calendar-day.current {
            background: linear-gradient(135deg, #ff6b6b, #ffa726);
            border-color: rgba(255, 107, 107, 0.5);
            color: white;
        }

        .calendar-day.locked {
            background: rgba(255, 182, 193, 0.2);
            border-color: rgba(255, 182, 193, 0.3);
            cursor: not-allowed;
            opacity: 0.6;
        }

        .day-number {
            font-weight: 700;
            font-size: 1.2rem;
        }

        .day-status {
            font-size: 0.8rem;
            margin-top: 4px;
            opacity: 0.8;
        }

        .day-image {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            object-fit: cover;
            margin-top: 6px;
            border: 2px solid rgba(255, 182, 193, 0.5);
        }

        .heart {
            position: fixed;
            top: 20px;
            right: 20px;
            font-size: 24px;
            color: #ff6b6b;
            animation: heartbeat 2s ease-in-out infinite;
            z-index: 1000;
        }

        .sparkle {
            position: fixed;
            width: 6px;
            height: 6px;
            background: #ffa726;
            border-radius: 50%;
            animation: sparkle 3s ease-in-out infinite;
        }

        .sparkle:nth-child(1) { top: 20%; left: 10%; animation-delay: 0s; }
        .sparkle:nth-child(2) { top: 60%; right: 15%; animation-delay: 1s; }
        .sparkle:nth-child(3) { bottom: 30%; left: 20%; animation-delay: 2s; }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes sparkle {
            0%, 100% { opacity: 0; transform: scale(0); }
            50% { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="heart">💖</div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    
    <div class="header">
        <div class="header-content">
            <div class="logo">Poryad</div>
            <div class="user-info">
                <span>Привіт, Марія!</span>
                <div class="avatar">М</div>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="welcome-card">
            <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=400&h=400&fit=crop&crop=face" alt="Денна заставка" class="welcome-image">
            <div class="welcome-text">"Сьогодні особливий день для нас обоє 💕"</div>
            <button class="start-btn">Почати челендж</button>
        </div>

        <div class="challenge-info">
            <h2 class="challenge-title">Челендж "Здорове харчування"</h2>
            <p class="challenge-description">
                Твій партнер створив для тебе особливий челендж! 
                Слухай умови та виконуй завдання щодня.
            </p>
            <button class="condition-btn">🎧 Слухати умови</button>
        </div>

        <div class="calendar">
            <div class="calendar-header">
                <h3 class="calendar-title">Календар челенджу</h3>
                <div class="calendar-nav">
                    <button class="nav-btn">‹</button>
                    <button class="nav-btn">›</button>
                </div>
            </div>
            
            <div class="calendar-grid">
                <div class="calendar-day completed">
                    <div class="day-number">1</div>
                    <div class="day-status">✓</div>
                    <img src="https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=100&h=100&fit=crop" alt="День 1" class="day-image">
                </div>
                
                <div class="calendar-day completed">
                    <div class="day-number">2</div>
                    <div class="day-status">✓</div>
                    <img src="https://images.unsplash.com/photo-1490645935967-10de6ba17061?w=100&h=100&fit=crop" alt="День 2" class="day-image">
                </div>
                
                <div class="calendar-day current">
                    <div class="day-number">3</div>
                    <div class="day-status">Сьогодні</div>
                    <img src="https://images.unsplash.com/photo-1546554137-f86b9593a222?w=100&h=100&fit=crop" alt="День 3" class="day-image">
                </div>
                
                <div class="calendar-day locked">
                    <div class="day-number">4</div>
                    <div class="day-status">Завтра</div>
                </div>
                
                <div class="calendar-day locked">
                    <div class="day-number">5</div>
                    <div class="day-status">Завтра</div>
                </div>
                
                <div class="calendar-day locked">
                    <div class="day-number">6</div>
                    <div class="day-status">Завтра</div>
                </div>
                
                <div class="calendar-day locked">
                    <div class="day-number">7</div>
                    <div class="day-status">Завтра</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
